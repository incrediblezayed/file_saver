name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run still going for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Catches packaging problems (a missing direct dependency, for one)
      # before a tag makes them permanent on pub.dev.
      - run: dart pub publish --dry-run

  build:
    name: Build example (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken platform should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: apk, args: --debug }
          - { os: ubuntu-latest, target: web, args: "" }
          - { os: ubuntu-latest, target: linux, args: --debug }
          - { os: macos-latest, target: macos, args: --debug }
          - { os: macos-latest, target: ios, args: --simulator --no-codesign }
    steps:
      - uses: actions/checkout@v4

      - if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: example

      # Building the example is what links the native plugin into a real app.
      # Compiling the plugin sources alone does not: the Windows 0.5.0 linker
      # regression only showed up at this step.
      - run: flutter build ${{ matrix.target }} ${{ matrix.args }}
        working-directory: example

  # The example depends on permission_handler, whose Windows plugin fails to
  # compile on current MSVC (STL1011: <experimental/coroutine> is now a hard
  # error). That is upstream and unrelated to this package, so Windows builds a
  # throwaway app that depends on file_saver alone. It still exercises the step
  # that matters: linking the plugin into a real app, which is what the 0.5.0
  # regression broke and what compiling the plugin sources alone never catches.
  build-windows:
    name: Build consumer app (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: file_saver
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create a consumer app
        # bash, not the Windows default PowerShell: the JSON path descriptor
        # below does not survive PowerShell's quoting rules.
        shell: bash
        run: |
          flutter create --platforms=windows consumer
          cd consumer
          flutter pub add 'file_saver:{"path":"../file_saver"}'
      - name: Build it
        shell: bash
        run: flutter build windows --debug
        working-directory: consumer
      - name: Confirm the plugin produced an import library
        shell: bash
        run: |
          find consumer/build/windows -name 'file_saver_plugin.lib' -print -quit | grep . \
            || { echo 'file_saver_plugin.lib was not produced'; exit 1; }
