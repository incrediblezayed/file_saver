name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run still going for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Catches packaging problems (a missing direct dependency, for one)
      # before a tag makes them permanent on pub.dev.
      - run: dart pub publish --dry-run

  build:
    name: Build example (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken platform should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: apk, args: --debug }
          - { os: ubuntu-latest, target: web, args: "" }
          - { os: ubuntu-latest, target: linux, args: --debug }
          - { os: macos-latest, target: macos, args: --debug }
          - { os: macos-latest, target: ios, args: --simulator --no-codesign }
          - { os: windows-latest, target: windows, args: --debug }
    steps:
      - uses: actions/checkout@v4

      - if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: example

      # Building the example is what links the native plugin into a real app.
      # Compiling the plugin sources alone does not: the Windows 0.5.0 linker
      # regression only showed up at this step.
      - run: flutter build ${{ matrix.target }} ${{ matrix.args }}
        working-directory: example
